name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Проверка идемпотентности (CMD синтаксис)
      - name: Check Migration Status
        id: check_status
        shell: cmd
        run: |
          if exist "%USERPROFILE%\.mattermost_migration_completed" (
            echo ✓ Database already migrated to PostgreSQL. Skipping data transfer.
            echo already_migrated=true>> "%GITHUB_OUTPUT%"
          ) else (
            echo ⚠ Migration required.
            echo already_migrated=false>> "%GITHUB_OUTPUT%"
          )

      # 2. Создание резервной копии MySQL
      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
        run: |
          echo 💾 Creating timestamped backup of MySQL...
          set BACKUP_NAME=mattermost_mysql_backup_%GITHUB_RUN_ID%.sql
          
          docker ps --format "{{.Names}}" | findstr /x "mattermost-mysql" >nul
          if %ERRORLEVEL% EQU 0 (
            docker exec mattermost-mysql mysqldump -u root -p%MYSQL_ROOT_PASSWORD% mattermost > %BACKUP_NAME%
            echo ✅ Backup successfully saved as %BACKUP_NAME%
          ) else (
            echo ❌ Error: Legacy MySQL container is not running!
            exit /b 1
          )

      # 3. Поднятие временного контейнера PostgreSQL
      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          docker compose -f %COMPOSE_FILE% up -d db-postgres
          echo ⏳ Waiting for PostgreSQL to initialize...
          timeout /t 15 /nobreak >nul

      # 4. Гетерогенная миграция данных с помощью pgloader
      - name: Run pgloader (With Schema Drop for Idempotency)
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          echo 🔄 Migrating schema and data from MySQL to PostgreSQL...
          
          set MYSQL_URI=mysql://root:%MYSQL_ROOT_PASSWORD%@mattermost-mysql/mattermost
          set PG_URI=postgresql://postgres:%DB_POSTGRES_PASSWORD%@mattermost-postgres/mattermost
          
          docker run --rm --network=mattermost_network ^
            mattermost/mattermost-pgloader:latest pgloader ^
            --with "include drop" ^
            %MYSQL_URI% ^
            %PG_URI%

      # 5. Установка маркерного флаг-файла
      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        run: |
          echo. 2>"%USERPROFILE%\.mattermost_migration_completed"
          echo ✅ Migration flag created.

      # 6. Развертывание обновленного продакшн-стека
      - name: Deploy Upgraded Stack
        shell: cmd
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          echo 🚀 Launching Upgraded Mattermost Stack...
          docker compose -f %COMPOSE_FILE% up -d --build --remove-orphans
          echo ⏳ Waiting for Mattermost to apply internal database updates...
          timeout /t 30 /nobreak >nul

      # 7. Автоматическое тестирование работоспособности
      - name: Run Health Checks & Verify Data
        shell: cmd
        run: |
          echo 🔍 Running Smoke Tests...
          curl -f http://localhost:8065/api/v4/system/ping
          if %ERRORLEVEL% NEQ 0 (
            echo ❌ Application health check failed. Fetching logs...
            docker compose -f %COMPOSE_FILE% logs
            exit /b 1
          )
          echo ✅ Mattermost upgraded successfully and running on Postgres!
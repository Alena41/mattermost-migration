name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Проверка идемпотентности (CMD)
      - name: Check Migration Status
        id: check_status
        shell: cmd
        run: |
          if exist "%USERPROFILE%\.mattermost_migration_completed" (
            echo [OK] Database already migrated to PostgreSQL. Skipping data transfer.
            echo already_migrated=true>> "%GITHUB_OUTPUT%"
          ) else (
            echo [WARN] Migration required.
            echo already_migrated=false>> "%GITHUB_OUTPUT%"
          )

      # 2. Создание резервной копии MySQL (CMD)
      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
        run: |
          echo [INFO] Creating timestamped backup of MySQL...
          set BACKUP_NAME=mattermost_mysql_backup_%GITHUB_RUN_ID%.sql
          
          :: Проверяем наличие контейнера
          set CONTAINER_ID=
          for /f %%i in ('docker ps -q -f "name=^mattermost-mysql$"') do set CONTAINER_ID=%%i
          
          if "%CONTAINER_ID%"=="" (
            echo [ERROR] Legacy MySQL container is not running!
            exit /b 1
          )
          
          :: Делаем бэкап
          docker exec mattermost-mysql mysqldump -u root -p%MYSQL_ROOT_PASSWORD% mattermost > %BACKUP_NAME%
          
          if %ERRORLEVEL% NEQ 0 (
            echo [ERROR] Failed to create backup!
            exit /b 1
          )
          
          echo [OK] Backup successfully saved as %BACKUP_NAME%

      # 3. Поднятие временного контейнера PostgreSQL (CMD)
      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          docker compose -f %COMPOSE_FILE% up -d db-postgres
          echo [INFO] Waiting for PostgreSQL to initialize...
          timeout /t 15 /nobreak >nul

      # 4. Гетерогенная миграция данных с помощью pgloader (CMD)
      - name: Run pgloader (With Schema Drop for Idempotency)
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          echo [INFO] Migrating schema and data from MySQL to PostgreSQL...
          
          set MYSQL_URI=mysql://root:%MYSQL_ROOT_PASSWORD%@mattermost-mysql/mattermost
          set PG_URI=postgresql://postgres:%DB_POSTGRES_PASSWORD%@mattermost-postgres/mattermost
          
          docker run --rm --network=mattermost_network ^
            mattermost/mattermost-pgloader:latest pgloader ^
            --with "include drop" ^
            %MYSQL_URI% ^
            %PG_URI%
            
          if %ERRORLEVEL% NEQ 0 (
            echo [ERROR] pgloader failed!
            exit /b 1
          )

      # 5. Установка маркерного флаг-файла (CMD)
      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        run: |
          echo. 2>"%USERPROFILE%\.mattermost_migration_completed"
          echo [OK] Migration flag created.

      # 6. Развертывание обновленного продакшн-стека (CMD)
      - name: Deploy Upgraded Stack
        shell: cmd
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          echo [INFO] Launching Upgraded Mattermost Stack...
          docker compose -f %COMPOSE_FILE% up -d --build --remove-orphans
          echo [INFO] Waiting for Mattermost to apply internal database updates...
          timeout /t 30 /nobreak >nul

      # 7. Автоматическое тестирование работоспособности (CMD)
      - name: Run Health Checks & Verify Data
        shell: cmd
        run: |
          echo [INFO] Running Smoke Tests...
          curl -f http://localhost:8065/api/v4/system/ping
          if %ERRORLEVEL% NEQ 0 (
            echo [ERROR] Application health check failed. Fetching logs...
            docker compose -f %COMPOSE_FILE% logs
            exit /b 1
          )
          echo [OK] Mattermost upgraded successfully and running on Postgres!